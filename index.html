<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rifa Solidaria | Ayuda Benéfica</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #f4f6f9;
        --card-bg: #ffffff;
        --text-dark: #2d3436;
        --text-light: #636e72;
        --accent-red: #e63946;
        --accent-soft: #ffe3e5;
        --accent-strong: #ffb3b8;
        --shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        --border-radius: 20px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background:
          radial-gradient(
            circle at 8% 12%,
            rgba(255, 198, 203, 0.26) 0 9%,
            transparent 28%
          ),
          radial-gradient(
            circle at 92% 18%,
            rgba(187, 231, 220, 0.3) 0 8%,
            transparent 27%
          ),
          radial-gradient(
            circle at 12% 88%,
            rgba(255, 221, 181, 0.24) 0 7%,
            transparent 25%
          ),
          radial-gradient(
            circle at 88% 90%,
            rgba(207, 213, 255, 0.24) 0 9%,
            transparent 28%
          ),
          linear-gradient(135deg, #fffafa 0%, #f7f8fc 48%, #f0faf7 100%);
        background-attachment: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      .container {
        background-color: var(--card-bg);
        border-radius: var(--border-radius);
        box-shadow: var(--shadow);
        max-width: 950px;
        width: 100%;
        padding: 30px;
        border: 1px solid #eee;
      }

      /* Cabecera */
      .header {
        display: grid;
        grid-template-columns: 1fr 1.2fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 2px dashed #f0f0f0;
        align-items: center;
      }

      .header-section {
        text-align: center;
      }

      .price-box {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 88% 14%,
            rgba(255, 255, 255, 0.72) 0 8%,
            transparent 9%
          ),
          radial-gradient(
            circle at 8% 88%,
            rgba(255, 255, 255, 0.5) 0 6%,
            transparent 7%
          ),
          linear-gradient(145deg, #eefaff 0%, #dff3fb 52%, #eaf7ff 100%);
        border: 1px solid #c7e7f3;
        border-radius: 12px;
        padding: 15px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.65);
      }
      .price-box::before {
        content: "";
        position: absolute;
        width: 100px;
        height: 100px;
        left: -58px;
        bottom: -62px;
        border: 13px solid rgba(255, 255, 255, 0.45);
        border-radius: 50%;
        pointer-events: none;
      }
      .price-box > * {
        position: relative;
        z-index: 1;
      }

      .premium-box {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 12% 18%,
            rgba(255, 255, 255, 0.8) 0 7%,
            transparent 8%
          ),
          radial-gradient(
            circle at 88% 82%,
            rgba(255, 255, 255, 0.55) 0 10%,
            transparent 11%
          ),
          linear-gradient(135deg, #fff0f1 0%, #ffe1d4 45%, #dff5ef 100%);
        border-radius: 12px;
        padding: 15px;
        border: 1px solid #f3c8c2;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.65);
      }
      .premium-box::before,
      .premium-box::after {
        position: absolute;
        pointer-events: none;
      }
      .premium-box::before {
        content: "";
        width: 110px;
        height: 110px;
        top: -55px;
        right: -25px;
        border: 14px solid rgba(255, 255, 255, 0.38);
        border-radius: 50%;
        box-shadow:
          -95px 125px 0 -35px rgba(230, 57, 70, 0.16),
          -115px 125px 0 -49px rgba(255, 255, 255, 0.55);
      }
      .premium-box::after {
        content: "♥  JUNTOS AYUDAMOS  ♥";
        right: 12px;
        bottom: 7px;
        color: rgba(181, 74, 79, 0.72);
        font-family: "Poppins", sans-serif;
        font-size: 0.48rem;
        font-weight: 800;
        letter-spacing: 1px;
      }
      .premium-box > * {
        position: relative;
        z-index: 1;
      }
      .premium-title {
        background: #000;
        color: white;
        display: inline-block;
        padding: 5px 15px;
        border-radius: 20px;
        font-family: "Poppins", sans-serif;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }
      .premium-item {
        font-weight: 800;
        font-size: 1.1rem;
        color: var(--text-dark);
        font-family: "Poppins", sans-serif;
      }
      .pig-icon {
        font-size: 3rem;
        margin-top: 10px;
      }

      .price-title {
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 12px;
        color: var(--text-light);
        font-weight: 600;
      }
      .price-value {
        font-family: "Poppins", sans-serif;
        font-size: 2.5rem;
        font-weight: 800;
        color: var(--accent-red);
        margin: 5px 0;
      }
      .account-info {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 10px;
        margin-top: 10px;
        border: 1px solid #e9ecef;
      }
      .account-label {
        color: var(--text-light);
        font-size: 12px;
        font-weight: 600;
      }
      .account-data {
        background: #2d3436;
        color: white;
        padding: 8px;
        border-radius: 8px;
        font-family: "Courier New", monospace;
        font-weight: bold;
        margin-bottom: 5px;
      }

      .img-frame {
        width: 140px;
        height: 200px;
        border-radius: 15px;
        padding: 5px;
        background: linear-gradient(45deg, #ff9a9e, #fecfef, #a1c4fd);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        margin-bottom: 10px;
        margin-left: auto;
        margin-right: auto;
      }
      #beneficiary-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 10px;
        border: 3px solid white;
      }

      /* Cuadrícula */
      .grid-title {
        font-family: "Poppins", sans-serif;
        text-align: center;
        font-weight: 600;
        color: var(--text-light);
        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 0.9rem;
      }
      .payment-summary {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin: 0 auto 18px;
        font-family: "Poppins", sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .payment-summary span {
        padding: 6px 12px;
        border-radius: 999px;
      }
      .paid-count {
        color: #18794e;
        background: #e3f7ed;
      }
      .pending-count {
        color: #9a6700;
        background: #fff4cc;
      }
      .grid {
        display: grid !important;
        grid-template-columns: repeat(10, 1fr);
        gap: 8px;
        width: 100%;
        min-width: 0;
      }

      .cell {
        background: #ffffff;
        border: 1px solid #ddd;
        border-radius: 8px;
        text-align: center;
        padding: 8px 5px;
        cursor: pointer;
        font-family: "Poppins", sans-serif;
        transition: all 0.2s;
        position: relative;
        user-select: none;
        min-height: 55px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-width: 0;
      }

      .cell:hover {
        background-color: #f0f4f8;
        border-color: var(--accent-strong);
        transform: translateY(-2px);
      }

      .num {
        font-size: 1.4rem;
        font-weight: 800;
        color: #000000;
        line-height: 1.2;
      }

      .name {
        font-family: "Inter", sans-serif;
        font-size: 0.7rem;
        font-weight: 600;
        color: #2d3436;
        max-width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 4px;
      }

      .cell.occupied {
        background-color: var(--accent-soft);
        border-color: var(--accent-strong);
        cursor: pointer;
      }
      .cell.occupied.paid {
        background-color: #e4f8ee;
        border-color: #9ddbb9;
      }
      .cell.occupied:hover {
        filter: brightness(0.97);
        border-color: #e58d96;
      }
      .cell.occupied.pending::before,
      .cell.occupied.paid::before {
        position: absolute;
        top: 4px;
        left: 5px;
        font-size: 0.55rem;
        font-weight: 800;
        letter-spacing: 0.2px;
      }
      .cell.occupied.pending::before {
        content: "DEBE";
        color: #9a6700;
      }
      .cell.occupied.paid::before {
        content: "PAGÓ";
        color: #18794e;
      }
      .cell.occupied .num {
        color: var(--accent-red);
      }
      .cell.occupied::after {
        content: "🌸";
        position: absolute;
        top: 4px;
        right: 4px;
        font-size: 0.8rem;
        opacity: 0.8;
      }

      .reset-btn {
        display: block;
        margin: 20px auto 0;
        padding: 8px 20px;
        background: #eee;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        color: #333;
      }
      .reset-btn:hover {
        background: #ddd;
      }

      /* Modal */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .modal-overlay.active {
        display: flex;
      }
      .modal-box {
        background: white;
        padding: 25px;
        border-radius: 15px;
        width: 90%;
        max-width: 400px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }
      .modal-box h3 {
        margin: 0 0 10px;
        font-family: "Poppins", sans-serif;
      }
      .modal-box p {
        color: #666;
        margin-bottom: 15px;
      }
      .modal-box input {
        width: 100%;
        padding: 10px;
        border: 2px solid #ddd;
        border-radius: 8px;
        margin-bottom: 15px;
        box-sizing: border-box;
      }
      .payment-choice {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
        text-align: left;
        color: #555;
        font-size: 0.9rem;
      }
      .payment-choice select {
        flex: 1;
        padding: 10px;
        border: 2px solid #ddd;
        border-radius: 8px;
        background: white;
        font: inherit;
      }
      .modal-buttons {
        display: flex;
        gap: 10px;
      }
      .btn {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-cancel {
        background: #eee;
        color: #333;
      }
      .btn-confirm {
        background: var(--accent-red);
        color: white;
      }
      .payment-actions {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }
      .btn-paid {
        background: #2e9d68;
        color: white;
      }
      .btn-pending {
        background: #f2c94c;
        color: #5f4b00;
      }
      .btn-delete {
        background: #f1d9dc;
        color: #a42635;
      }

      @media (max-width: 768px) {
        body {
          padding: 10px;
        }
        .container {
          padding: 20px 12px;
        }
        .header {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        .grid {
          grid-template-columns: repeat(5, minmax(0, 1fr));
          gap: 5px;
        }
        .cell {
          padding: 8px 2px;
        }
        .num {
          font-size: 1.15rem;
        }
        .name {
          font-size: 0.62rem;
        }
      }

      @media (max-width: 380px) {
        .container {
          padding-left: 8px;
          padding-right: 8px;
        }
        .grid {
          gap: 4px;
        }
        .num {
          font-size: 1rem;
        }
        .name {
          font-size: 0.56rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="header-section premium-box">
          <div class="premium-title">SE RIFA</div>
          <div class="premium-item">Un brazo <br />de chancho</div>
          <div class="pig-icon">🐷</div>
        </div>

        <div class="header-section price-box">
          <div class="price-title">Valor del número</div>
          <div class="price-value">$1.00</div>
          <div class="account-info">
            <div class="account-label">N° de Cuenta</div>
            <div class="account-data">2203804103</div>
            <div class="account-label" style="font-weight: bold; color: #000">
              Máximo Vicente<br />Fernández
            </div>
          </div>
        </div>

        <div class="header-section">
          <div class="img-frame">
            <!-- Código corregido para que NUNCA dé error de onerror -->
            <img
              id="beneficiary-img"
              src="public/beneficiaria.jpeg"
              onerror="
                this.onerror = null;
                this.src =
                  'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNTAiIGhlaWdodD0iMTYwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZWVlIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGRvbWluYW50LWJhc2VsaW5lPSJtaWRkbGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiM2NjYiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNCI+Rm90bzwvdGV4dD48L3N2Zz4=';
              "
              alt="Beneficiaria"
            />
          </div>
          <div style="font-weight: 700; margin-top: 5px">Nuestra Causa</div>
        </div>
      </div>

      <h2 class="grid-title">Elige tu número de la suerte</h2>
      <div class="payment-summary" id="paymentSummary" aria-live="polite"></div>
      <div id="grid" class="grid"></div>

      <!-- <button class="reset-btn" onclick="resetData()">🔄 Reiniciar cuadrícula</button> -->
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <h3>¡Número elegido!</h3>
        <p>
          Estás reservando el número <strong id="modalNum"></strong>. Escribe tu
          nombre:
        </p>
        <input
          type="text"
          id="userNameInput"
          placeholder="Tu nombre completo"
          autocomplete="off"
        />
        <label class="payment-choice" for="paymentStatus">
          Estado:
          <select id="paymentStatus">
            <option value="pending">No pagó</option>
            <option value="paid">Pagó</option>
          </select>
        </label>
        <div class="modal-buttons">
          <button class="btn btn-cancel" onclick="closeModal()">
            Cancelar
          </button>
          <button class="btn btn-confirm" onclick="confirmReservation()">
            Confirmar
          </button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="paymentActionOverlay">
      <div class="modal-box">
        <h3>Administrar reserva</h3>
        <p id="paymentActionText"></p>
        <div class="payment-actions">
          <button class="btn btn-paid" type="button" id="markPaidButton">
            Marcar como pagado
          </button>
          <button class="btn btn-pending" type="button" id="markPendingButton">
            Marcar como no pagó
          </button>
          <button class="btn btn-delete" type="button" id="deleteReservationButton">
            Quitar reserva
          </button>
          <button class="btn btn-cancel" type="button" id="closePaymentActionButton">
            Cancelar
          </button>
        </div>
      </div>
    </div>

    <!-- El script al final del body garantiza que el HTML ya esté cargado -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
      import {
        getAuth,
        signInAnonymously,
      } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
      import {
        getDatabase,
        onValue,
        ref,
        remove,
        runTransaction,
      } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAqTkimOeTLAfFtrG7Z8bygb9ZbPD9Kvc0",
        authDomain: "rifa-solidaria-699c1.firebaseapp.com",
        databaseURL: "https://rifa-solidaria-699c1-default-rtdb.firebaseio.com",
        projectId: "rifa-solidaria-699c1",
        storageBucket: "rifa-solidaria-699c1.firebasestorage.app",
        messagingSenderId: "1008991277163",
        appId: "1:1008991277163:web:4f53542ba9e571ba99e12e",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const database = getDatabase(app);
      const reservationsRef = ref(database, "reservations");
      let gridData = {};

      const totalNumbers = 100;
      const gridContainer = document.getElementById("grid");
      const paymentSummary = document.getElementById("paymentSummary");

      const modalOverlay = document.getElementById("modalOverlay");
      const modalNum = document.getElementById("modalNum");
      const userNameInput = document.getElementById("userNameInput");
      const paymentStatus = document.getElementById("paymentStatus");
      const paymentActionOverlay = document.getElementById("paymentActionOverlay");
      const paymentActionText = document.getElementById("paymentActionText");
      const markPaidButton = document.getElementById("markPaidButton");
      const markPendingButton = document.getElementById("markPendingButton");
      const deleteReservationButton = document.getElementById("deleteReservationButton");
      const closePaymentActionButton = document.getElementById("closePaymentActionButton");
      let currentSelectedNum = null;
      let currentActionNum = null;

      function normalizeReservation(value) {
        if (typeof value === "string") {
          return { name: value, status: "pending" };
        }
        if (value && typeof value === "object") {
          return {
            name: String(value.name || value.nombre || "Sin nombre"),
            status:
              value.status === "paid" || value.status === "pagado"
                ? "paid"
                : "pending",
          };
        }
        return null;
      }

      function updatePaymentSummary() {
        let paid = 0;
        let pending = 0;
        Object.values(gridData).forEach((value) => {
          const reservation = normalizeReservation(value);
          if (!reservation) return;
          if (reservation.status === "paid") {
            paid += 1;
          } else {
            pending += 1;
          }
        });
        paymentSummary.innerHTML = `
          <span class="paid-count">Pagados: ${paid}</span>
          <span class="pending-count">Pendientes: ${pending}</span>
        `;
      }

      function renderGrid() {
        gridContainer.innerHTML = "";
        updatePaymentSummary();
        for (let i = 1; i <= totalNumbers; i++) {
          const cell = document.createElement("div");
          cell.classList.add("cell");

          if (gridData[i]) {
            const reservation = normalizeReservation(gridData[i]);
            if (!reservation) continue;
            cell.classList.add("occupied");
            cell.classList.add(reservation.status);
            cell.title = `${reservation.name} - ${
              reservation.status === "paid" ? "Pagado" : "Pendiente"
            }`;
            cell.innerHTML = `<div class="num">${i}</div><div class="name">${reservation.name}</div>`;
          } else {
            cell.innerHTML = `<div class="num">${i}</div>`;
          }

          cell.addEventListener("click", () => handleCellClick(i));
          gridContainer.appendChild(cell);
        }
      }

      function handleCellClick(num) {
        if (gridData[num]) {
          const reservation = normalizeReservation(gridData[num]);
          currentActionNum = num;
          paymentActionText.textContent = `Número ${num}: ${reservation.name}`;
          paymentActionOverlay.classList.add("active");
        } else {
          currentSelectedNum = num;
          modalNum.textContent = num;
          userNameInput.value = "";
          paymentStatus.value = "pending";
          modalOverlay.classList.add("active");
          userNameInput.focus();
        }
      }

      function closeModal() {
        modalOverlay.classList.remove("active");
        currentSelectedNum = null;
      }

      function closePaymentActionModal() {
        paymentActionOverlay.classList.remove("active");
        currentActionNum = null;
      }

      function updatePaymentStatus(status) {
        if (currentActionNum === null) return;
        runTransaction(
          ref(database, `reservations/${currentActionNum}`),
          (currentValue) => {
            const reservation = normalizeReservation(currentValue);
            if (!reservation) return;
            return { name: reservation.name, status };
          },
        )
          .then(() => closePaymentActionModal())
          .catch((error) => {
            console.error("No se pudo actualizar el pago:", error);
            alert(getFirebaseWriteError(error, "actualizar el estado de pago"));
          });
      }

      function deleteCurrentReservation() {
        if (currentActionNum === null) return;
        if (!confirm("¿Quitar completamente esta reserva?")) return;
        remove(ref(database, `reservations/${currentActionNum}`))
          .then(() => closePaymentActionModal())
          .catch((error) => {
            console.error("No se pudo quitar la reserva:", error);
            alert(getFirebaseWriteError(error, "quitar la reserva"));
          });
      }

      function getFirebaseWriteError(error, action) {
        if (error?.code === "PERMISSION_DENIED") {
          return `Firebase no permite ${action}. Revisa las reglas de Realtime Database.`;
        }
        return `No se pudo ${action}. Verifica la conexión e intenta de nuevo.`;
      }

      async function confirmReservation() {
        const name = userNameInput.value.trim();
        if (!name || currentSelectedNum === null) {
          alert("Por favor, escribe un nombre.");
          return;
        }

        const number = currentSelectedNum;
        const status = paymentStatus.value;
        const reservationRef = ref(database, `reservations/${number}`);
        try {
          const result = await runTransaction(
            reservationRef,
            (currentValue) => {
              return currentValue === null
                ? { name, status }
                : undefined;
            },
          );

          if (!result.committed) {
            alert("Ese número acaba de ser reservado por otra persona.");
            return;
          }

          closeModal();
        } catch (error) {
          console.error("No se pudo reservar el número:", error);
          alert(
            "No se pudo guardar la reserva. Verifica la conexión y la configuración de Firebase.",
          );
        }
      }

      modalOverlay.addEventListener("click", (e) => {
        if (e.target === modalOverlay) closeModal();
      });
      paymentActionOverlay.addEventListener("click", (e) => {
        if (e.target === paymentActionOverlay) closePaymentActionModal();
      });
      markPaidButton.addEventListener("click", () => updatePaymentStatus("paid"));
      markPendingButton.addEventListener("click", () => updatePaymentStatus("pending"));
      deleteReservationButton.addEventListener("click", deleteCurrentReservation);
      closePaymentActionButton.addEventListener("click", closePaymentActionModal);

      userNameInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") confirmReservation();
      });

      function resetData() {
        if (
          confirm("¿Seguro que quieres borrar todos los números reservados?")
        ) {
          remove(reservationsRef).catch((error) => {
            console.error("No se pudieron borrar las reservas:", error);
            alert("No se pudieron borrar las reservas. Intenta de nuevo.");
          });
        }
      }

      renderGrid();
      window.closeModal = closeModal;
      window.confirmReservation = confirmReservation;

      signInAnonymously(auth)
        .then(() => {
          onValue(
            reservationsRef,
            (snapshot) => {
              gridData = snapshot.val() || {};
              renderGrid();
            },
            (error) => {
              console.error("No se pudieron leer las reservas:", error);
              alert(
                "No se pudieron cargar las reservas. Revisa las reglas de Realtime Database.",
              );
            },
          );
        })
        .catch((error) => {
          console.error("No se pudo iniciar la sesión anónima:", error);
          alert(
            "No se pudo conectar con Firebase. Activa el acceso anónimo en Authentication.",
          );
        });
    </script>
  </body>
</html>
