<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa Solidaria | Ayuda Benéfica</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-dark: #2d3436;
            --text-light: #636e72;
            --accent-red: #e63946;
            --accent-soft: #ffe3e5;
            --accent-strong: #ffb3b8;
            --shadow: 0 20px 40px rgba(0,0,0,0.08);
            --border-radius: 20px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            max-width: 950px;
            width: 100%;
            padding: 30px;
            border: 1px solid #eee;
        }

        /* Cabecera */
        .header {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px dashed #f0f0f0;
            align-items: center;
        }

        .header-section { text-align: center; }

        .premium-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #e9ecef;
        }
        .premium-title {
            background: #000;
            color: white;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .premium-item {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--text-dark);
            font-family: 'Poppins', sans-serif;
        }
        .pig-icon {
            font-size: 3rem;
            margin-top: 10px;
        }

        .price-title {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
            color: var(--text-light);
            font-weight: 600;
        }
        .price-value {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent-red);
            margin: 5px 0;
        }
        .account-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #e9ecef;
        }
        .account-label {
            color: var(--text-light);
            font-size: 12px;
            font-weight: 600;
        }
        .account-data {
            background: #2d3436;
            color: white;
            padding: 8px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .img-frame {
            width: 140px;
            height: 200px;
            border-radius: 15px;
            padding: 5px;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #a1c4fd);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            margin-bottom: 10px;
            margin-left: auto;
            margin-right: auto;
        }
        #beneficiary-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid white;
        }

        /* Cuadrícula */
        .grid-title {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
        }
        .grid {
            display: grid !important;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            width: 100%;
            min-width: 0;
        }

        .cell {
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
            padding: 8px 5px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s;
            position: relative;
            user-select: none;
            min-height: 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-width: 0;
        }

        .cell:hover {
            background-color: #f0f4f8;
            border-color: var(--accent-strong);
            transform: translateY(-2px);
        }

        .num {
            font-size: 1.4rem;
            font-weight: 800;
            color: #000000;
            line-height: 1.2;
        }

        .name {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2d3436;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 4px;
        }

        .cell.occupied {
            background-color: var(--accent-soft);
            border-color: var(--accent-strong);
            cursor: not-allowed;
        }
        .cell.occupied .num {
            color: var(--accent-red);
        }
        .cell.occupied::after {
            content: '🌸';
            position: absolute;
            top: 4px;
            right: 4px;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .reset-btn {
            display: block;
            margin: 20px auto 0;
            padding: 8px 20px;
            background: #eee;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        .reset-btn:hover { background: #ddd; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-box h3 { margin: 0 0 10px; font-family: 'Poppins', sans-serif; }
        .modal-box p { color: #666; margin-bottom: 15px; }
        .modal-box input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .modal-buttons { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-cancel { background: #eee; color: #333; }
        .btn-confirm { background: var(--accent-red); color: white; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 20px 12px; }
            .header { grid-template-columns: 1fr; gap: 16px; }
            .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
            .cell { padding: 8px 2px; }
            .num { font-size: 1.15rem; }
            .name { font-size: 0.62rem; }
        }

        @media (max-width: 380px) {
            .container { padding-left: 8px; padding-right: 8px; }
            .grid { gap: 4px; }
            .num { font-size: 1rem; }
            .name { font-size: 0.56rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-section premium-box">
                <div class="premium-title">SE RIFA</div>
                <div class="premium-item">Una cabeza<br>de chancho</div>
                <div class="pig-icon">🐷</div>
            </div>

            <div class="header-section">
                <div class="price-title">Valor del número</div>
                <div class="price-value">$1.00</div>
                <div class="account-info">
                    <div class="account-label">N° de Cuenta</div>
                    <div class="account-data">2203804103</div>
                    <div class="account-label" style="font-weight: bold; color: #000;">Máximo Vicente<br>Fernández</div>
                </div>
            </div>

            <div class="header-section">
                <div class="img-frame">
                    <!-- Código corregido para que NUNCA dé error de onerror -->
                    <img id="beneficiary-img" src="public/beneficiaria.jpeg" 
                         onerror="this.onerror=null; this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNTAiIGhlaWdodD0iMTYwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZWVlIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGRvbWluYW50LWJhc2VsaW5lPSJtaWRkbGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiM2NjYiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNCI+Rm90bzwvdGV4dD48L3N2Zz4=';" 
                         alt="Beneficiaria">
                </div>
                <div style="font-weight: 700; margin-top: 5px;">Nuestra Causa</div>
            </div>
        </div>

        <h2 class="grid-title">Elige tu número de la suerte</h2>
        <div id="grid" class="grid"></div>
        
        <!-- <button class="reset-btn" onclick="resetData()">🔄 Reiniciar cuadrícula</button> -->
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h3>¡Número elegido!</h3>
            <p>Estás reservando el número <strong id="modalNum"></strong>. Escribe tu nombre:</p>
            <input type="text" id="userNameInput" placeholder="Tu nombre completo" autocomplete="off">
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-confirm" onclick="confirmReservation()">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- El script al final del body garantiza que el HTML ya esté cargado -->
    <script>
        // Datos en memoria (si el navegador bloquea localStorage, no rompe nada)
        let gridData = {};
        try {
            gridData = JSON.parse(localStorage.getItem('rifaSolidariaData')) || {};
        } catch (e) { gridData = {}; }

        const totalNumbers = 100;
        const gridContainer = document.getElementById('grid');

        const modalOverlay = document.getElementById('modalOverlay');
        const modalNum = document.getElementById('modalNum');
        const userNameInput = document.getElementById('userNameInput');
        let currentSelectedNum = null;

        function saveData() {
            try { localStorage.setItem('rifaSolidariaData', JSON.stringify(gridData)); } catch (e) {}
        }

        function renderGrid() {
            gridContainer.innerHTML = '';
            for (let i = 1; i <= totalNumbers; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                
                if (gridData[i]) {
                    cell.classList.add('occupied');
                    cell.innerHTML = `<div class="num">${i}</div><div class="name">${gridData[i]}</div>`;
                } else {
                    cell.innerHTML = `<div class="num">${i}</div>`;
                }

                cell.addEventListener('click', () => handleCellClick(i));
                gridContainer.appendChild(cell);
            }
        }

        function handleCellClick(num) {
            if (gridData[num]) {
                if (confirm(`El número ${num} ya está reservado por: ${gridData[num]}. ¿Quieres liberarlo?`)) {
                    delete gridData[num];
                    saveData();
                    renderGrid();
                }
            } else {
                currentSelectedNum = num;
                modalNum.textContent = num;
                userNameInput.value = '';
                modalOverlay.classList.add('active');
                userNameInput.focus();
            }
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            currentSelectedNum = null;
        }

        function confirmReservation() {
            const name = userNameInput.value.trim();
            if (!name) { alert("Por favor, escribe un nombre."); return; }
            gridData[currentSelectedNum] = name;
            saveData();
            closeModal();
            renderGrid();
        }

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        userNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') confirmReservation();
        });

        function resetData() {
            if (confirm("¿Seguro que quieres borrar todos los números reservados?")) {
                gridData = {};
                saveData();
                renderGrid();
            }
        }

        // Ejecutar al instante
        renderGrid();
    </script>
</body>
</html>
